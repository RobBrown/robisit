<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Robot Rob">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc8bc"/>
      <stop offset="1" stop-color="#8a8378"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c58c"/>
      <stop offset="1" stop-color="#a8844e"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- antenna -->
  <line x1="60" y1="24" x2="60" y2="10" stroke="#6e675d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="4.5" fill="#ffa000" filter="url(#glow)"/>

  <!-- body: dark collared shirt with red stitching -->
  <path d="M12 140 Q14 108 44 101 L76 101 Q106 108 108 140 Z" fill="#2b2731" stroke="#4a4452" stroke-width="1.5"/>
  <path d="M44 101 L60 117 L76 101" fill="none" stroke="#3a3542" stroke-width="5" stroke-linejoin="round"/>
  <path d="M41 104 L60 121 L79 104" fill="none" stroke="#b2453c" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <path d="M22 140 Q24 116 40 108" fill="none" stroke="#b2453c" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <path d="M98 140 Q96 116 80 108" fill="none" stroke="#b2453c" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <!-- chest status panel -->
  <rect x="50" y="124" width="20" height="9" rx="2" fill="#120f0c" stroke="#3a3530"/>
  <circle cx="55" cy="128.5" r="1.6" fill="#7fd6c2"/>
  <circle cx="60" cy="128.5" r="1.6" fill="#ffa000"/>
  <circle cx="65" cy="128.5" r="1.6" fill="#b2453c"/>

  <!-- neck -->
  <rect x="50" y="92" width="20" height="11" fill="#5e574e"/>
  <line x1="50" y1="96" x2="70" y2="96" stroke="#3f3a33" stroke-width="1.2"/>
  <line x1="50" y1="99.5" x2="70" y2="99.5" stroke="#3f3a33" stroke-width="1.2"/>

  <!-- ears -->
  <rect x="15" y="52" width="11" height="22" rx="3" fill="#7a7368" stroke="#4e473f" stroke-width="1.5"/>
  <rect x="94" y="52" width="11" height="22" rx="3" fill="#7a7368" stroke="#4e473f" stroke-width="1.5"/>
  <circle cx="20.5" cy="63" r="2" fill="#ffa000"/>
  <circle cx="99.5" cy="63" r="2" fill="#ffa000"/>

  <!-- head -->
  <rect x="24" y="28" width="72" height="66" rx="18" fill="url(#metal)" stroke="#4e473f" stroke-width="2"/>
  <path d="M34 34 Q60 30 86 34" fill="none" stroke="#ece7de" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <circle cx="32" cy="86" r="1.8" fill="#5e574e"/>
  <circle cx="88" cy="86" r="1.8" fill="#5e574e"/>

  <!-- spiky sandy hair, swept up -->
  <path d="M26 46 Q24 32 33 27 L32 21 L39 25 L41 17 L47 23 L51 15 L56 22 L61 14 L65 22 L71 16 L73 24 L80 19 L80 27 L87 25 L86 32 Q95 35 94 46 Q88 38 76 37 Q62 35 50 37 Q34 39 26 46 Z" fill="url(#hair)" stroke="#8a6a3c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M40 30 L46 26 M53 28 L58 23 M64 28 L70 22 M75 30 L80 26" stroke="#f0dcae" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- face screen -->
  <rect x="32" y="45" width="56" height="41" rx="10" fill="#17120d"/>

  <!-- LED eyes, blue-green -->
  <circle cx="47" cy="60" r="4.5" fill="#7fd6c2" filter="url(#glow)"/>
  <circle cx="73" cy="60" r="4.5" fill="#7fd6c2" filter="url(#glow)"/>

  <!-- thin rectangular glasses -->
  <g fill="none" stroke="#5b5fa6" stroke-width="2.4" stroke-linejoin="round">
    <rect x="35.5" y="52.5" width="23" height="15" rx="3"/>
    <rect x="61.5" y="52.5" width="23" height="15" rx="3"/>
    <path d="M58.5 57 Q60 55.5 61.5 57"/>
    <path d="M35.5 56 L26 57"/>
    <path d="M84.5 56 L94 57"/>
  </g>
  <path d="M38 55 L42 55" stroke="#c8cbf0" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
  <path d="M64 55 L68 55" stroke="#c8cbf0" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>

  <!-- friendly half smile -->
  <path d="M49 76 Q61 82 72 75" fill="none" stroke="#ffa000" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
</svg>
